<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0" />
    <title>Gakushu Sochi</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main>
      <header>
        <h1>Gakushu Sochi</h1>
        <button id="close" aria-label="閉じる">×</button>
      </header>
      <p id="error" role="alert"></p>
      <label>選択テキスト<textarea id="selection" rows="7" readonly></textarea></label
      ><button id="retry">選択を再取得</button
      ><label
        >質問<textarea id="question" rows="3" placeholder="何を知りたいですか？"></textarea>
      </label>
      <div class="actions"><button id="send">送信</button><button id="settings">設定</button></div>
      <section>
        <h2>回答</h2>
        <pre id="answer"></pre>
      </section>
      <form id="settings-form" hidden>
        <h2>設定</h2>
        <label>ショートカット<input id="shortcut" required /></label
        ><label
          >OpenAI API キー<input
            id="api-key"
            type="password"
            autocomplete="off"
            placeholder="変更時のみ入力" /></label
        ><label>モデル<input id="model" required /></label
        ><label>温度<input id="temperature" type="number" min="0" max="2" step="0.1" /></label
        ><label>最大トークン<input id="max-tokens" type="number" min="1" max="16384" /></label
        ><label><input id="restore" type="checkbox" /> クリップボードを復元する</label
        ><label><input id="login" type="checkbox" /> ログイン時に起動する</label
        ><button>保存</button>
      </form>
    </main>
    <script type="module" src="renderer.js"></script>
  </body>
</html>
