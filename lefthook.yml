pre-commit:
  parallel: true
  commands:
    format:
      run: npm run format:check
    lint:
      run: npm run lint
    compile:
      run: npm run compile

pre-push:
  commands:
    concepts:
      run: npm run check:concepts
    worker-types:
      run: npm run check:worker-types
    test:
      run: npm run test
